<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160">
  <rect width="300" height="160" fill="#f1faee"/>
  <!-- Kacamata anti radiasi: frame persegi tipis warna biru, lensa biru muda -->
  <rect x="50" y="50" width="90" height="66" rx="8" fill="#a8dadc" fill-opacity="0.55" stroke="#1d3557" stroke-width="6"/>
  <rect x="160" y="50" width="90" height="66" rx="8" fill="#a8dadc" fill-opacity="0.55" stroke="#1d3557" stroke-width="6"/>
  <line x1="140" y1="66" x2="160" y2="66" stroke="#1d3557" stroke-width="6"/>
  <line x1="50" y1="64" x2="20" y2="56" stroke="#1d3557" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="64" x2="280" y2="56" stroke="#1d3557" stroke-width="6" stroke-linecap="round"/>
  <!-- kilau lensa -->
  <line x1="65" y1="100" x2="85" y2="70" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="175" y1="100" x2="195" y2="70" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
